name: immune-path
description: 'Immune-Path (Yidao Biotechnology (Suzhou) Co., Ltd. / 怡道生物) is a China-based
  vaccine biotechnology company founded in 2017 and headquartered in Suzhou. The company
  develops human vaccines across recombinant protein antigen, novel viral vector, and
  messenger RNA (mRNA) platforms, backed by its own vaccine adjuvant technology. Its clinical
  and preclinical pipeline includes a recombinant zoster (shingles) vaccine produced in CHO
  cells, a nine-valent recombinant HPV vaccine expressed in Pichia pastoris, a respiratory
  syncytial virus (RSV) vaccine, a therapeutic gastric cancer vaccine, and a COVID-19 vaccine.
  Immune-Path is a portfolio company of Qiming Venture Partners. It is a life-sciences drug
  developer with no public developer, API, or software surface; this profile is maintained
  as a company record in the API Evangelist network.'
